aid: genhealthai
name: GenHealth.ai
description: 'GenHealth.ai builds generative AI for healthcare operations, powered by a Large Medical
  Model (LMM) trained on sequences of medical events. Its products automate the administrative back
  office for providers, health plans, and DME suppliers: fax intake routing, prior authorization and
  medical-necessity review (UMPA), and revenue cycle management. The developer platform exposes an
  Inference API that generates simulated patient futures from demographic, ICD diagnosis, CPT/HCPCS
  procedure, and NDC medication codes, an Embeddings API for semantic search over medical sequences,
  and a UM/PA API that uploads, extracts, and adjudicates prior-authorization PDFs. GenHealth integrates
  with any FHIR server implementing the HL7 Da Vinci prior-authorization guides (CRD, DTR, PAS). The
  platform is SOC 2 and HIPAA compliant with a public trust center and status page.'
